<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit-7 Berserker</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header>
    <h1>Orbit-7 Berserker</h1>
    <p id="status">Idle: breathing heavy, watching you</p>
  </header>

  <section class="stage blink" id="stage" data-mode="idle" aria-label="Angry robot in a fire storm">
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="flash" aria-hidden="true"></div>
    <svg viewBox="0 0 300 390" role="img" aria-label="Angry animated robot">
      <defs>
        <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d7788"/><stop offset=".55" stop-color="#2b313c"/><stop offset="1" stop-color="#14171d"/></linearGradient>
        <clipPath id="vis"><polygon points="90,94 210,94 202,138 98,138"/></clipPath>
      </defs>
      <ellipse id="ring" cx="150" cy="362" rx="124" ry="15"/>
      <ellipse cx="150" cy="360" rx="76" ry="9" fill="#000" opacity=".5"/>
      <g id="robot">
        <!-- legs -->
        <polygon points="106,296 144,296 140,336 110,336" fill="url(#metal)"/>
        <polygon points="156,296 194,296 190,336 160,336" fill="url(#metal)"/>
        <polygon points="98,336 148,336 152,350 94,350" fill="#0b0d11"/>
        <polygon points="152,336 202,336 206,350 148,350" fill="#0b0d11"/>
        <!-- arms with claws -->
        <g id="armL">
          <polygon points="64,226 92,226 90,290 66,290" fill="url(#metal)"/>
          <polygon points="60,288 96,288 100,312 84,320 70,320 56,312" fill="#0b0d11"/>
          <polygon points="60,312 64,336 72,314" fill="#cfd5df"/><polygon points="74,316 80,340 86,316" fill="#cfd5df"/><polygon points="86,314 94,334 98,310" fill="#cfd5df"/>
        </g>
        <g id="armR">
          <polygon points="236,226 208,226 210,290 234,290" fill="url(#metal)"/>
          <polygon points="240,288 204,288 200,312 216,320 230,320 244,312" fill="#0b0d11"/>
          <polygon points="240,312 236,336 228,314" fill="#cfd5df"/><polygon points="226,316 220,340 214,316" fill="#cfd5df"/><polygon points="214,314 206,334 202,310" fill="#cfd5df"/>
        </g>
        <!-- torso -->
        <polygon points="134,176 166,176 170,194 130,194" fill="#0b0d11"/>
        <polygon points="82,194 218,194 208,300 92,300" fill="url(#metal)"/>
        <polygon points="104,208 196,208 188,272 112,272" fill="#0b0d11"/>
        <polygon points="150,216 172,238 150,260 128,238" fill="none" stroke="#2b313c" stroke-width="3"/>
        <circle class="core" cx="150" cy="238" r="12"/>
        <path class="crack" d="M112 214 L126 230 L118 246 L132 262"/>
        <path class="crack" d="M188 214 L174 230 L182 246 L168 262"/>
        <rect x="120" y="282" width="60" height="8" fill="#0b0d11"/>
        <!-- spiked shoulders -->
        <polygon points="56,202 106,190 102,232 64,228" fill="url(#metal)"/><polygon points="64,200 56,166 90,194" fill="#aeb6c3"/>
        <polygon points="244,202 194,190 198,232 236,228" fill="url(#metal)"/><polygon points="236,200 244,166 210,194" fill="#aeb6c3"/>
        <!-- head -->
        <g id="headTilt" transform="rotate(0 150 170)">
          <g id="headIn">
            <polygon points="92,80 64,14 120,72" fill="#aeb6c3"/>
            <polygon points="208,80 236,14 180,72" fill="#aeb6c3"/>
            <polygon points="66,110 44,118 66,140" fill="#0b0d11"/>
            <polygon points="234,110 256,118 234,140" fill="#0b0d11"/>
            <polygon points="82,70 218,70 234,120 212,180 88,180 66,120" fill="url(#metal)"/>
            <polygon points="90,94 210,94 202,138 98,138" fill="#07080b"/>
            <g clip-path="url(#vis)"><rect id="beam" x="90" y="94" width="10" height="44"/></g>
            <g id="eyes">
              <polygon class="eye" points="102,100 144,114 140,130 104,122"/>
              <polygon class="eye" points="198,100 156,114 160,130 196,122"/>
            </g>
            <polygon points="88,92 150,112 150,102 92,80" fill="#0b0d11"/>
            <polygon points="212,92 150,112 150,102 208,80" fill="#0b0d11"/>
            <!-- fanged mouth -->
            <rect id="mouthGlow" x="114" y="150" width="72" height="20"/>
            <rect x="112" y="143" width="76" height="4" fill="#0b0d11"/>
            <g fill="#e3e7ee">
              <polygon points="114,147 126,147 120,160"/><polygon points="126,147 138,147 132,158"/><polygon points="138,147 150,147 144,160"/>
              <polygon points="150,147 162,147 156,158"/><polygon points="162,147 174,147 168,160"/><polygon points="174,147 186,147 180,158"/>
            </g>
            <g id="jaw">
              <rect x="112" y="170" width="76" height="5" fill="#0b0d11"/>
              <g fill="#e3e7ee">
                <polygon points="114,171 126,171 120,160"/><polygon points="126,171 138,171 132,162"/><polygon points="138,171 150,171 144,160"/>
                <polygon points="150,171 162,171 156,162"/><polygon points="162,171 174,171 168,160"/><polygon points="174,171 186,171 180,162"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </svg>
  </section>

  <section class="panel" aria-label="Controls">
    <div class="group">
      <h2>Behaviour</h2>
      <div class="seg" id="modes">
        <button type="button" data-mode="idle" aria-pressed="true">Idle</button>
        <button type="button" data-mode="hunt" aria-pressed="false">Hunt</button>
        <button type="button" data-mode="rage" aria-pressed="false">Rage</button>
        <button type="button" data-mode="rampage" aria-pressed="false">Rampage</button>
        <button type="button" data-mode="roar" aria-pressed="false">Roar</button>
      </div>
    </div>
    <div class="group">
      <h2>Flame colour</h2>
      <div class="swatches" id="swatches">
        <button type="button" data-i="0" style="background:#ff2d2d" aria-label="Hellfire red" aria-pressed="true"></button>
        <button type="button" data-i="1" style="background:#ff8a1f" aria-label="Inferno orange" aria-pressed="false"></button>
        <button type="button" data-i="2" style="background:#7dff3a" aria-label="Toxic green" aria-pressed="false"></button>
        <button type="button" data-i="3" style="background:#3aa8ff" aria-label="Blue flame" aria-pressed="false"></button>
        <button type="button" data-i="4" style="background:#b04dff" aria-label="Violet flame" aria-pressed="false"></button>
      </div>
    </div>
    <div class="group">
      <h2>Tuning</h2>
      <div class="row"><label for="fire">Fire</label><input id="fire" type="range" min="0" max="10" step="1" value="7"><output id="fireO">7</output></div>
      <div class="row"><label for="wind">Wind</label><input id="wind" type="range" min="0" max="10" step="1" value="4"><output id="windO">4</output></div>
      <div class="row"><label for="speed">Speed</label><input id="speed" type="range" min="0.5" max="2.5" step="0.1" value="1"><output id="speedO">1.0x</output></div>
      <div class="row"><label for="glow">Eye glow</label><input id="glow" type="range" min="0" max="28" step="1" value="14"><output id="glowO">14</output></div>
      <div class="row"><label for="tilt">Head tilt</label><input id="tilt" type="range" min="-20" max="20" step="1" value="0"><output id="tiltO">0°</output></div>
    </div>
    <div class="group toggles">
      <label class="tg">Play animation<input type="checkbox" id="play" checked><span class="sw"></span></label>
      <label class="tg">Eye flicker<input type="checkbox" id="blink" checked><span class="sw"></span></label>
      <label class="tg">Summoning ring<input type="checkbox" id="tgRing" checked><span class="sw"></span></label>
      <label class="tg">Embers and wind streaks<input type="checkbox" id="tgEmb" checked><span class="sw"></span></label>
    </div>
    <div class="actions"><button type="button" id="reset">Reset all</button></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
