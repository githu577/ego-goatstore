<!-- Attitude Lamborghini Supercar Mascot -->
    <div class="anime-showcase">
      <div class="blue-aura"></div>
      <div class="lambo-wrapper">
        <svg class="lambo-svg" viewBox="0 0 420 230" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="lamboBody" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#11192e" />
              <stop offset="50%" stop-color="#050811" />
              <stop offset="100%" stop-color="#0038a8" />
            </linearGradient>
            <linearGradient id="windshieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.55" />
              <stop offset="50%" stop-color="#040a1a" stop-opacity="0.9" />
              <stop offset="100%" stop-color="#0051ff" stop-opacity="0.4" />
            </linearGradient>
            <radialGradient id="headlightGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="40%" stop-color="#00e1ff" />
              <stop offset="100%" stop-color="#0051ff" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- Ground Neon Underglow -->
          <ellipse cx="210" cy="186" rx="175" ry="14" fill="#00aaff" opacity="0.35" class="underglow-pulse" />

          <!-- Aggressive Rear Wing / Spoiler -->
          <polygon points="35,98 85,92 92,106 28,108" fill="#060b19" stroke="#00d4ff" stroke-width="2" />
          <line x1="65" y1="106" x2="72" y2="122" stroke="#00d4ff" stroke-width="3" />

          <!-- Main Sharp Lamborghini Body -->
          <path d="M25,152 L42,118 L125,112 L185,76 L275,78 L345,116 L396,134 L402,158 L375,168 L45,168 Z"
                fill="url(#lamboBody)" stroke="#00b7ff" stroke-width="2.4" stroke-linejoin="round" />

          <!-- Tinted Cabin Windshield & Side Window -->
          <polygon points="145,112 190,82 268,84 316,114" fill="url(#windshieldGrad)" stroke="#00e1ff" stroke-width="1.6" />
          <line x1="228" y1="83" x2="222" y2="113" stroke="#040814" stroke-width="4" />

          <!-- Sharp Side Air Intake & Attitude Lines -->
          <polygon points="135,126 195,122 182,154 126,154" fill="#03060f" stroke="#0066ff" stroke-width="1.8" />
          <line x1="210" y1="138" x2="325" y2="142" stroke="#00d4ff" stroke-width="1.8" opacity="0.8" />

          <!-- Front Splitter -->
          <polygon points="340,162 406,156 400,169 335,169" fill="#00d4ff" />

          <!-- Y-Shaped Glowing Lamborghini Headlight ("Chok Jolmol Korbe") -->
          <g class="lambo-eye-flash">
            <ellipse cx="362" cy="132" rx="34" ry="18" fill="url(#headlightGlow)" />
            <polyline points="342,126 364,132 384,124" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" />
            <line x1="364" y1="132" x2="386" y2="137" stroke="#00e1ff" stroke-width="3" stroke-linecap="round" />
          </g>

          <!-- Rear Wheel -->
          <g>
            <circle cx="96" cy="162" r="32" fill="#05070d" stroke="#00aaff" stroke-width="2.5" />
            <circle cx="96" cy="162" r="20" fill="#0a1226" stroke="#00d4ff" stroke-width="1.5" />
            <circle cx="96" cy="162" r="7" fill="#00e1ff" />
          </g>

          <!-- Front Wheel -->
          <g>
            <circle cx="322" cy="162" r="31" fill="#05070d" stroke="#00aaff" stroke-width="2.5" />
            <circle cx="322" cy="162" r="19" fill="#0a1226" stroke="#00d4ff" stroke-width="1.5" />
            <circle cx="322" cy="162" r="7" fill="#00e1ff" />
          </g>
        </svg>
      </div>
      <div class="mascot-badge">
        <span class="anim-icon pulse-icon">🏎️</span> EGO AVENTADOR • V12 EDITION
      </div>
    </div>
