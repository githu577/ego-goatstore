<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoatStore – GoatBot Command Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Style.css">
</head>
<body>
<canvas id="fire" aria-hidden="true"></canvas>

<header class="hero">
  <h1 class="logo">GoatStore</h1>
  <p class="tag">GoatBot-er command gulo ekhane pao. Copy koro, download koro, ba nijer ta upload koro.</p>
  <div class="tools">
    <input id="search" type="search" placeholder="Command khojo…" aria-label="Command khojo">
    <button id="uploadBtn" class="btn solid">Command upload</button>
    <input id="fileInput" type="file" accept=".js" multiple hidden>
  </div>
</header>

<main>
  <div id="drop" class="drop">Ekhane .js file drag kore chhere dao</div>
  <section id="grid" class="grid" aria-live="polite"></section>
  <p id="empty" class="empty" hidden>Kono command pawa jayni. Onno naam diye khojo ba notun file upload koro.</p>
</main>

<div id="toast" class="toast" role="status"></div>
<script src="App.js"></script>
</body>
</html>
